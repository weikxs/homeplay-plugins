name: Plugin request
description: Suggest a source plugin for a platform, self-hosted service, or API
labels: [plugin request]
body:
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: A video platform, streaming service, music server, WebDAV folder, or catalogue
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: API documentation or proposed access path
      placeholder: Documentation link, service link, or a description if no public API exists
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have described known access/configuration requirements and rights or distribution considerations, including anything still unknown.
          required: true
        - label: This request does not claim an unimplemented or untested capability is already available.
          required: true
  - type: textarea
    id: details
    attributes:
      label: What the plugin should do
      description: Search, play, lyrics, charts…
